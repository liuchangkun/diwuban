# 日志系统配置（MVP）
logging: # 日志系统根配置
  timezone: "Asia/Shanghai" # 日志时间戳时区
  time_format: "%Y-%m-%d %H:%M:%S.%f+08" # 时间格式（含微秒，时区固定+08）
  level: "INFO" # 根 logger 级别（影响默认阈值）
  format: "pipe" # 输出格式：pipe|json|keyvalue（当前实现 pipe 管道分隔）
  localize: true # 是否将 extra_json 的键中文化
  sql_slow_ms: 1000 # 慢SQL阈值（毫秒；>=该值标记为慢SQL）
  sql:
    explain_on_slow: true # 慢SQL时尝试采集 EXPLAIN 摘要（仅 SELECT）
    explain_timeout_ms: 200 # EXPLAIN 最长等待时间
    explain_max_length: 2000 # EXPLAIN 文本最大长度（超出截断）
  capture: # 采集策略（自动参数/返回值脱敏与截断）
    params: true # 是否采集函数入参（方案A自动采集）
    return: true # 是否采集函数返回值
    max_field_length: 2000 # 字符串最大长度；超出则截断并追加...
    mask_keys: [password, token, id_card] # 需要脱敏的键（不区分大小写）
  activity: # 过程日志增强
    step_slow_ms: 200 # 步骤慢阈值（>0 则启用）
    capture_result_summary: true # 对返回结果做摘要（shape/len/统计/哈希）
    summary_max_length: 1000 # 摘要文本最大长度
  jobs:
    retry_log: # 作业重试日志控制
      enabled: true
      include_policy: true # 是否输出策略细节（backoff/jitter 等）
      threshold_ms: 50 # 超过该值才输出详细重试日志
  dependencies:
    http_out:
      enabled: true # 是否记录出站HTTP日志
      mask_headers: [authorization, cookie]
  cache:
    enabled: true # 是否记录缓存日志
    slow_ms: 20 # 缓存操作慢阈值（仅在慢或未命中时输出）
  database:
    tx:
      enabled: true # 是否记录事务边界（BEGIN/COMMIT/ROLLBACK）
    pool_log:
      enabled: true # 是否记录连接池关键事件
      acquire_slow_ms: 200 # 获取连接慢阈值
      create_slow_ms: 200 # 创建连接慢阈值
      health_check_slow_ms: 100 # 健康检查慢阈值
      include_thread: true
      include_stack: false
  async:
    enabled: true
    queue_size: 100000
    batch_size: 200
    flush_interval_ms: 100
    backpressure: "drop_debug" # block|drop_debug|drop_oldest
    force_sync_levels: ["CRITICAL"]
  hot_reload:
    enabled: true
    backend: "watchfiles" # none|watchfiles
  outputs:
    - name: "console" # 输出名称（可自定义多个 console/file 输出）
      type: "console" # 输出类型：console=控制台，file=文件
      enabled: true # 是否启用该输出
      level: "DEBUG" # 该输出拦截的最小日志级别
      color: false # 控制台彩色是否启用（为避免重定向ANSI与UTF-16问题，默认关闭）
      colors: # 级别→颜色映射（值可用颜色名或ANSI码；优先使用此映射，否则用内置默认）
        DEBUG: grey # 灰（或使用 "\u001b[90m"）
        INFO: green # 绿
        WARNING: yellow # 黄
        ERROR: red # 红
        CRITICAL: bright_red # 亮红
    - name: "app_file"
      type: "file"
      enabled: true
      level: "INFO"
      path: "logs/app.log"
      rotate:
        type: "size"
        max_bytes: 104857600
        backup_count: 50
        compress: false
    - name: "error_file"
      type: "file"
      enabled: true
      level: "ERROR"
      path: "logs/error.log"
      rotate:
        type: "size"
        max_bytes: 10485760
        backup_count: 50
    - name: "sql_file"
      type: "file"
      enabled: true
      level: "INFO"
      path: "logs/sql.log"
      rotate:
        type: "size"
        max_bytes: 104857600
        backup_count: 50
      route:
        only_loggers: ["sql"]
    - name: "anomaly_file"
      type: "file"
      enabled: true
      level: "INFO"
      path: "logs/anomaly_diagnosis.log"
      rotate:
        type: "size"
        max_bytes: 104857600
        backup_count: 50
        compress: false
      route:
        only_loggers: ["anomaly", "db.func", "db.view"]  # 移除 sql，避免污染异常诊断文件
    - name: "db_pool_file"
      type: "file"
      enabled: true
      level: "INFO"
      path: "logs/db_pool.log"
      rotate:
        type: "size"
        max_bytes: 104857600
        backup_count: 50
      route:
        only_loggers: ["db.pool"]
  fields:
    include:
      - timestamp
      - pid
      - processName
      - threadId
      - 线程名
      - filename
      - module
      - funcName
      - lineno
      - level
      - message
      - extra_json
    # 中英文字段映射配置（完全替代代码内硬编码）
    localize_map:
      type: "类型"
      event: "事件"
      params: "参数"
      duration_ms: "耗时ms"
      resource_delta: "资源变化"
      return: "返回值"
      sql: "SQL语句"
      rows: "行数"
      error: "错误信息"
      action: "操作"
      status: "状态"
      detail: "详情"
      request_id: "请求ID"
      trace_id: "追踪ID"
      user_id: "用户ID"
      tenant: "租户"
      slow: "慢SQL"
      result: "结果"
      threadName: "线程名"
      window: "窗口"
      start: "开始"
      end: "结束"
      device_id: "设备ID"
      run_id: "运行ID"
      dedup_ratio: "去重比例"
      sql_cost_ms: "SQL耗时ms"
      rows_merged: "合并行数"
      rows_deduped: "去重行数"
      rows_input: "输入行数"
      affected_rows: "影响行数"
      stats: "统计"
      flags: "标志"
      codes: "质量码"
      diag_level: "诊断级别"
      pool_id: "连接池ID"
      use_count: "使用次数"
      wait_ms: "等待ms"
      total: "总连接"
      idle: "空闲连接"
      active: "活动连接"
      age_ms: "连接年龄ms"
      idle_ms: "空闲时长ms"
      duration: "耗时"
      dsn_preview: "连接串预览"
  deps:
    psutil: "auto"
    colorlog: "auto"
    concurrent_log_handler: "auto"
    orjson: "auto"
  palette: # 颜色名称→ANSI 映射（PipeFormatter 不再硬编码）
    grey: "\u001b[90m"
    gray: "\u001b[90m"
    green: "\u001b[32m"
    yellow: "\u001b[33m"
    red: "\u001b[31m"
    bright_red: "\u001b[91m"
    blue: "\u001b[34m"
    cyan: "\u001b[36m"
    magenta: "\u001b[35m"
