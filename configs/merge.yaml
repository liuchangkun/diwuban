# 合并配置（merge.yaml）
# 说明：run_all 为一键流程的开关与参数；每个子项均有中文注释
run_all:
  # 异常诊断输出级别：off | brief | full
  anomaly_diagnosis:
    level: off  # 临时禁用诊断模式以提升性能
  # 缺失指标计算配置：用于 orchestrator 的缺失指标批量计算（enable_calculation=true 时生效）
  calculation_cfg:
    auto_parallel: true  # 是否自动选择串/并行
    max_workers: 4       # 并行工作线程上限
    metrics:
      # 计算指标清单：留空表示计算所有 Scheduler.METRIC_ORDER 中的指标
      # 当前计划启用的指标（来自 Scheduler.METRIC_ORDER）：9 项
      - pump_flow_rate        # 泵流量；用途：估算各泵瞬时流量；依赖：main_pipeline_flow_rate / pump_active_power / pump_frequency 等；方法：A~F
      - pump_inlet_pressure   # 泵进口压力；用途：计算泵扬程的关键依赖；依赖：pool_liquid_level / main_pipeline_inlet_pressure；方法：A/B（必须在 pump_head 之前计算）
      - pump_head             # 泵扬程；用途：衡量泵进出口压力差形成的水头；依赖：pump_outlet_pressure / pump_inlet_pressure / pool_liquid_level；方法：MAIN/HEAD_COEF_V1
      - pump_outlet_pressure  # 泵出口压力；用途：设备出口侧压力；依赖：传感器/泵扬程与进口压/站出口压；方法：A~D
      - pump_efficiency       # 泵效率；用途：运行能效评估；依赖：pump_flow_rate / pump_head / pump_active_power；方法：EFF_SIMPLE_V1
      - pump_speed            # 泵转速；用途：工况分析与扭矩计算；依赖：pump_frequency；方法：A/B/C
      - pump_torque           # 泵扭矩；用途：轴功率与机械负载评估；依赖：pump_flow_rate / pump_head / pump_speed 或 pump_active_power / pump_frequency；方法：A/B
      - main_pipeline_inlet_pressure   # 总管进口压力；用途：站内供水边界条件；依赖：pool_liquid_level / main_pipeline_flow_rate 等；方法：PIN_COEF_V1 等
      - main_pipeline_outlet_pressure  # 总管出口压力；用途：站外供水边界条件；依赖：各泵出口压力或推算；方法：A~C
      - pump_cumulative_flow  # 泵累计流量；用途：能量与水量核算；依赖：pump_flow_rate 或 main_pipeline_*；方法：A/B
    write_to_db: true    # 结果写入 fact_measurements（quality_status=1）
  create_staging: true   # 创建并清空 staging 结构
  device_running: true   # 计算设备运行状态（mv_device_running_1s）
  device_running_cfg:
    audit_granularity: day          # 审计聚合粒度（日/周/月）
    force_recompute: false          # 是否强制重算（忽略缓存/既有结果）
    max_device_concurrency: 2       # 并行设备数上限
    slice: week                     # 时间切片粒度
    update_only_when_changed: true  # 仅在结果发生变化时才更新
  enable_calculation: true  # 启用缺失指标计算（在 merge-fact 之后执行）
  ingest_copy: true         # 从 CSV 批量导入至 staging
  merge_fact: true          # 合并至 fact_measurements（时间对齐）
  prepare_dim: true         # 阶段1：重建维度表（在 merge-fact 前执行）
  prepare_dim_stage2: true  # 阶段2：生成规则表（在 merge-fact 后执行）
  skip_shadow_rules: true  # 是否跳过影子规则生成（生产环境可设为true以提升50%性能；影响：无法进行影子表对比验证；跳过函数：run_auto_baseline_b, compute_metric_quality_rules_shadow, run_running_thresholds_b）
  reset_db: false
  reset_db_schemas:
  - public
  - monitoring
  reset_logs: true          # 运行前清理日志目录

# 分段执行控制
segmented:
  enabled: false            # 关闭分片，避免每段重复全表扫描导致卡住
  granularity: 15m          # 分片粒度（示例：15m/1h）
# 时区设置
tz:
  allow_missing_tz: true    # 允许缺失时区配置
  default_station_tz: Asia/Shanghai  # 默认站点时区
  missing_tz_policy: default         # 缺失时区策略：default=使用默认
# 窗口参数（当 --no-use-staging-time-range 时使用）
window:
  end: null    # 结束时间（ISO8601）
  size: 10m    # 默认窗口大小
  start: null  # 起始时间（ISO8601）
