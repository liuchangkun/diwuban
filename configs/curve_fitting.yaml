# 特性曲线拟合系统配置文件
# 版本: v1.0
# 更新日期: 2025-12-08
# 参考文档: 特性曲线开发/开发文档/06_数据库/03_配置和迁移.md
#
# ⚠️ 重要说明：
# - 本配置文件仅包含系统级配置
# - 业务参数（阈值、约束、推荐方法等）必须存储在数据库中
# - 禁止在此文件中定义任何业务相关参数

# ==================== 缓存配置 ====================
# 仅内存缓存，禁止 Redis
cache:
  enabled: true
  backend: "memory"
  lru:
    max_size: 1000
    max_memory_mb: 512
  ttl:
    curve_result: 3600      # 曲线结果缓存 TTL（秒）
    device_params: 86400    # 设备参数缓存 TTL（秒）

# ==================== 并行控制配置 ====================
parallel:
  enabled: true
  max_workers: 4
  batch_size: 100
  timeout_seconds: 300

# ==================== 数据预处理默认配置 ====================
preprocessing:
  min_data_points: 50       # 拟合最小数据点数（对应 MIN_DATA_POINTS）
  min_extraction_points: 100  # 数据提取建议点数（对应 MIN_EXTRACTION_POINTS）
  max_data_points: 100000
  outlier_detection: "3sigma"
  normalization_enabled: true

# ==================== 频率归一化配置 ====================
# 解决 50Hz 硬编码问题
frequency_normalization:
  reference_freq: 50.0      # 参考频率（Hz）- 所有变频泵曲线归一化到此频率
  min_freq: 25.0            # 最小有效频率（Hz）- 低于此值视为无效
  max_freq: 60.0            # 最大有效频率（Hz）- 高于此值视为无效
  default_freq: 50.0        # 默认频率（Hz）- 当查询不到频率数据时使用
  std_threshold: 2.0        # 频率波动阈值（Hz）- 用于判断是否需要频率归一化

# ==================== 泵组处理配置 ====================
pump_group:
  power_diff_threshold: 0.10  # 功率差异阈值 - 用于区分同构/异构泵组
  freq_diff_threshold: 2.0    # 频率差异阈值（Hz）- 用于区分VFD_HETEROGENEOUS_FREQ场景

  # 修正模型配置（用于并联合成方法）
  correction_model:
    model_type: "polynomial"  # 模型类型: linear, polynomial, xgboost
    polynomial_degree: 2      # 多项式阶数（仅 polynomial）
    regularization_alpha: 1.0  # 正则化系数（L2）
    min_training_points: 100  # 最小训练数据点数
    validation_ratio: 0.2     # 验证集比例

  # 直接拟合配置（v2.0新增）
  direct_fit:
    enabled: true             # 是否启用直接拟合
    min_data_points: 100      # 最小数据点数
    min_r_squared: 0.85       # 最小R²阈值
    regularization_alpha: 1.0 # Ridge正则化系数
    cv_folds: 5               # 交叉验证折数
    auto_degree_selection: true  # 是否自动选择多项式阶数
    degree_range: [2, 4]      # 多项式阶数范围（自动选择时）

  # 数据提取配置
  data_extraction:
    time_bucket_interval: "5 minutes"  # 时间窗口聚合间隔
    flow_std_threshold: 5.0   # 流量标准差阈值（稳态过滤）
    pressure_std_threshold: 0.5  # 压力标准差阈值（稳态过滤）
    min_running_pumps: 1      # 最小运行泵数

  # 对比分析配置
  comparison:
    recommendation_threshold_pct: 2.0  # 推荐阈值（百分比）
    # 当指标差异 > 2% 时，认为显著不同

# ==================== 监控告警配置 ====================
monitoring:
  enabled: true
  alerts:
    r_squared_warning: 0.90     # R² 警告阈值
    r_squared_critical: 0.80    # R² 严重告警阈值
    fit_time_warning_seconds: 60  # 拟合耗时警告阈值（秒）

# ==================== 日志配置 ====================
logging:
  level: "INFO"
  format: "[%(asctime)s] [%(levelname)s] [%(name)s] %(message)s"
  extra_data_enabled: true

