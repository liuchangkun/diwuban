# 可视化配置文件
# 版本: v1.0
# 创建日期: 2025-12-09
# 说明: 所有可视化相关配置，禁止在代码中硬编码

# 分辨率配置
resolution:
  # 8K UHD分辨率
  width: 7680
  height: 4320
  dpi: 300
  # 图像尺寸（英寸）
  figure_width: 25.6
  figure_height: 14.4

# 中文字体配置
fonts:
  # 主字体（优先使用）
  primary: "SimHei"
  # 备用字体
  fallback: "Microsoft YaHei"
  # 字体大小
  title_size: 48
  label_size: 36
  legend_size: 32
  tick_size: 28
  annotation_size: 24

# 颜色方案配置
colors:
  # 原始数据散点
  scatter: "#3498db"
  # 拟合曲线
  curve: "#e74c3c"
  # 95%置信区间
  confidence_95: "#fadbd8"
  # 99%置信区间
  confidence_99: "#f5b7b1"
  # 网格线
  grid: "#bdc3c7"
  # 历史版本曲线（多条）
  history:
    - "#2ecc71"
    - "#9b59b6"
    - "#f39c12"
    - "#1abc9c"
  # 泵组专用颜色
  pump_group:
    # 运行数据
    data: "#3498db"
    # 并联合成曲线
    synthesis: "#e74c3c"
    # 直接拟合曲线
    direct_fit: "#2ecc71"
    # 推荐方法高亮
    recommended: "#f39c12"

# 输出格式配置
output:
  # 图片格式
  format: "png"
  # PNG压缩级别（0-9，6为平衡值）
  compression: 6
  # 是否透明背景
  transparent: false
  # 背景颜色
  background_color: "white"
  # 是否紧凑布局
  tight_layout: true

# 图表样式配置
style:
  # 散点图
  scatter:
    alpha: 0.6
    size: 20
    edge_width: 0
  # 曲线
  curve:
    line_width: 3
    line_style: "-"
  # 置信区间
  confidence:
    alpha: 0.3
  # 网格
  grid:
    alpha: 0.3
    line_width: 1
    line_style: "--"
  # 图例
  legend:
    frame_alpha: 0.9
    shadow: true
    border_width: 1

# 统计信息框配置
stats_box:
  # 位置（'upper right', 'upper left', 'lower right', 'lower left'）
  location: "upper right"
  # 字体大小
  font_size: 28
  # 背景颜色
  background_color: "white"
  # 边框颜色
  border_color: "#bdc3c7"
  # 透明度
  alpha: 0.9
  # 圆角半径
  border_radius: 5

# 曲线类型标签映射（中文）
curve_labels:
  qh:
    title: "流量-扬程特性曲线"
    xlabel: "流量 Q (m³/h)"
    ylabel: "扬程 H (m)"
  qp:
    title: "流量-功率特性曲线"
    xlabel: "流量 Q (m³/h)"
    ylabel: "功率 P (kW)"
  qeta:
    title: "流量-效率特性曲线"
    xlabel: "流量 Q (m³/h)"
    ylabel: "效率 η (%)"

# 性能配置
performance:
  # matplotlib后端（非交互式，节省内存）
  backend: "Agg"
  # 是否及时关闭Figure
  close_figures: true
  # 内存不足时降级到4K分辨率
  fallback_4k:
    enabled: true
    width: 3840
    height: 2160

# 文件命名模板
file_naming:
  # 主曲线图
  curve: "{device_id}_{curve_type}_{version}_curve.png"
  # 残差分析图
  residuals: "{device_id}_{curve_type}_{version}_residuals.png"
  # 置信区间图
  confidence: "{device_id}_{curve_type}_{version}_confidence.png"
  # 对比图
  comparison: "{device_id}_{curve_type}_{version}_comparison.png"
  # 泵组合成曲线
  pump_group_synthesis: "station_{station_id}_pumps_{pump_combination}_{version}_synthesis.png"
  # 泵组直接拟合曲线
  pump_group_direct_fit: "station_{station_id}_pumps_{pump_combination}_{version}_direct_fit.png"
  # 泵组对比图
  pump_group_comparison: "station_{station_id}_pumps_{pump_combination}_{version}_comparison.png"

